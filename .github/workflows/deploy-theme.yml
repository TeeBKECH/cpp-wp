name: Deploy WordPress Theme via SSH

on:
  push:
    branches:
      - cursor/development-environment-setup-8ef2
    paths:
      - "wp-content/themes/cpp-courses-theme/**"
      - ".github/workflows/deploy-theme.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy theme via rsync over SSH
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./wp-content/themes/cpp-courses-theme/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:wp-content/themes/cpp-courses-theme/
